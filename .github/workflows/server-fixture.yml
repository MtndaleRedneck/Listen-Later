name: Server fixture (test only)
# Manual, test-only: builds PigeonPod v1.31.0 (b6e1a49) with the documented patches, runs its tests,
# then starts it in Docker with synthetic data and checks the behavior the docs describe.
on:
  workflow_dispatch:
  push:
    branches: [fixture-1120]
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [stock, custom]
    steps:
      - uses: actions/checkout@v4
      - name: Check out the packaged candidate (server/ as shipped)
        uses: actions/checkout@v4
        with: { ref: 08f2c8a7f78f21270a35f93c68fe7d63428d45b8, path: cand }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Prepare tree
        run: ./cand/server/fixture/prepare.sh ${{ matrix.variant }}
      - name: Server tests and image (packaged build.sh)
        shell: bash
        run: set -o pipefail; ./cand/server/fixture/build.sh ${{ matrix.variant }} 2>&1 | tee mvn-${{ matrix.variant }}.log | grep -E 'Tests run:|BUILD|ERROR|Successfully' | tail -40
      - name: Run fixture
        run: ./cand/server/fixture/run-fixture.sh ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-${{ matrix.variant }}
          path: mvn-${{ matrix.variant }}.log
