name: Server fixture (test only)
# Manual, test-only: builds PigeonPod v1.31.0 (b6e1a49) with the documented patches, runs its tests,
# then starts it in Docker with synthetic data and checks the behavior the docs describe.
on:
  workflow_dispatch:
  push:
    branches: [fixture-1120]
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [stock, custom]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Prepare tree
        run: ./server-fixture/prepare.sh ${{ matrix.variant }}
      - name: Server tests (mvn test)
        shell: bash
        run: |
          set -o pipefail
          cd pp
          mvn -B -f backend/pom.xml test 2>&1 | tee ../mvn-${{ matrix.variant }}.log | grep -E 'Tests run:|BUILD|ERROR' | tail -40
      - name: Build image (repo Dockerfile)
        run: cd pp && docker build -t pp-fixture:${{ matrix.variant }} .
      - name: Run fixture
        run: ./server-fixture/run-fixture.sh ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-${{ matrix.variant }}
          path: mvn-${{ matrix.variant }}.log
