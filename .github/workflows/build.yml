name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub release (only after review sign-off)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3

      - name: "Guard: update pop-up never scrolls sideways"
        run: |
          if grep -rn "horizontalScroll" app/src/main/java/com/listenlater/StatusScreen.kt; then
            echo "StatusScreen must not scroll horizontally - long text wraps, notes scroll vertically."
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: listenlater
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No signing secrets set"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          ./gradlew --no-daemon assembleRelease assembleDebug
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Name the APK
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$V" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk ListenLater-v$V.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ListenLater-apk
          path: ListenLater-v*.apk

      # Releases are published only on manual dispatch, after review sign-off.
      # An existing release is never replaced; bump versionName for a new one.
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v$VERSION
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump versionName to publish a new release."
            exit 0
          fi
          grep -q "^## What's new in $VERSION\$" release-notes.md || { echo "release-notes.md is not for $VERSION"; exit 1; }
          if [ -f release-notes.md ]; then
            gh release create "$TAG" "ListenLater-v$VERSION.apk" \
              --target "$(git rev-parse HEAD)" \
              --title "Listen Later $TAG" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" "ListenLater-v$VERSION.apk" \
              --target "$(git rev-parse HEAD)" \
              --title "Listen Later $TAG" \
              --notes "Listen Later $TAG."
          fi

  # Real screenshots from an emulator on every main push; used for review before release.
  screenshots:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: ./scripts/shots.sh
      - name: Commit screenshots
        run: |
          git config user.name "MtndaleRedneck"
          git config user.email "117659952+MtndaleRedneck@users.noreply.github.com"
          git add docs/screenshots docs/main.png
          git commit -m "Add app screenshots from emulator" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
