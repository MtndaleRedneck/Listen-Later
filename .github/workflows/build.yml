name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub release (only after review sign-off)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Read-only: branch-dispatched runs execute branch-controlled Gradle, so the
    # signing secrets and the write token stay out of this job (ChatGPT review).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Record checked-out commit
        run: echo "CHECKED-OUT-SHA $(git rev-parse HEAD) run-sha ${{ github.sha }}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
      - name: Android SDK 37
        run: |
          if ! ls "$ANDROID_HOME/platforms" | grep -q '^android-37'; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" >/dev/null
          fi

      - name: "Guard: update pop-up never scrolls sideways"
        run: |
          if grep -rn "horizontalScroll" app/src/main/java/com/listenlater/StatusScreen.kt; then
            echo "StatusScreen must not scroll horizontally - long text wraps, notes scroll vertically."
            exit 1
          fi

      # Robolectric downloads its android-all runtime to ~/.m2 outside Gradle's cache; keep
      # it across runs, and retry the test task once - Maven Central 429s are a known flake.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('**/build.gradle.kts') }}

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest || { echo "::warning::the first unit-test run failed and this green is a retry - read the first failure in the log above"; ./gradlew --no-daemon testDebugUnitTest; }

      - name: Unit test counts (from the JUnit XML)
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t=f=e=sk=0
          for p in sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml')):
              r=ET.parse(p).getroot(); a=[int(r.get(k,0)) for k in ('tests','failures','errors','skipped')]
              print('%-70s tests=%d failures=%d errors=%d skipped=%d' % (r.get('name'), *a))
              t+=a[0]; f+=a[1]; e+=a[2]; sk+=a[3]
          print('UNIT TEST TOTAL: tests=%d failures=%d errors=%d skipped=%d' % (t,f,e,sk))
          PY

      # The real keystore is decoded ONLY on a manual publish run from main, so
      # branch-controlled builds never see the signing secrets. Every other run
      # signs with a throwaway keystore: the release APK stays installable for
      # release-smoke, and the throwaway signature never ships (publish reuses
      # only the APK from a main publish run).
      - name: Decode release keystore (publish run only)
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No signing secrets set"; exit 1; fi
          # No cleanup trap here: a step-scoped EXIT trap would delete the file
          # before the Build APKs step reads it. Cleanup lives in Build APKs.
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Build APKs
        env:
          KEY_ALIAS: listenlater
        run: |
          # Keystore cleanup survives a Gradle failure (step-scoped trap).
          trap 'rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/ci-throwaway.keystore"' EXIT
          if [ -n "$KEYSTORE_FILE" ] && [ ! -f "$KEYSTORE_FILE" ]; then
            echo "KEYSTORE_FILE is set but the file is missing: $KEYSTORE_FILE" >&2
            exit 1
          fi
          if [ -z "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci-throwaway.keystore" \
              -alias listenlater -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass ci-throwaway -keypass ci-throwaway \
              -dname "CN=CI Throwaway" 2>/dev/null
            export KEYSTORE_FILE="$RUNNER_TEMP/ci-throwaway.keystore"
            export KEYSTORE_PASSWORD=ci-throwaway
          fi
          ./gradlew --no-daemon assembleRelease assembleDebug

      - name: Name the APK
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$V" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk ListenLater-v$V.apk
          cp app/build/outputs/apk/debug/app-debug.apk ListenLater-debug-v$V.apk

      # SHA-256 manifest of the exact APKs this build produced. Later jobs of the same run re-check
      # the downloaded APKs against it, so a substituted or altered artifact fails closed.
      - name: Write APK SHA-256 manifest
        run: |
          sha256sum ListenLater-v*.apk ListenLater-debug-v*.apk | tee ListenLater-SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ListenLater-apk
          path: |
            ListenLater-*.apk
            ListenLater-SHA256SUMS.txt

  # Releases are published only on manual dispatch, after review sign-off.
  # An existing release is never replaced; bump versionName for a new one.
  # The write token lives only in this main-only publish job (ChatGPT review).
  publish:
    # Every release-correctness job must be green BEFORE the release is
    # created (I2 review): the publish is the last job, not a parallel one.
    # upgrade-smoke is publish-dispatch-gated like this job, so on a real
    # publish run all four needs have run; on any other run this job's own
    # if is false and it never runs.
    needs: [build, release-smoke, migration-test, upgrade-smoke]
    concurrency:
      group: publish-release
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Record checked-out commit
        run: echo "CHECKED-OUT-SHA $(git rev-parse HEAD) run-sha ${{ github.sha }}"
      - uses: actions/download-artifact@v4
        with:
          name: ListenLater-apk
      - name: Verify downloaded APKs against the build manifest
        run: sha256sum -c ListenLater-SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # Pinned cover-art hash: the review package names this value. Update it in the
          # same commit whenever docs/podcast-cover-3000.png changes.
          EXPECTED_COVER_SHA256: 67a5ffa246860845f300326a594f39d780a03bf0bb545a1bff39fbf37c587b59
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG=v$VERSION
          # Fail closed on an existing tag OR release: a tag without a release would make
          # `gh release create` reuse the old tag (ignoring --target). No overwrite, explicit nonzero.
          # Strict: only an actual HTTP 404 means absent, HTTP 200 means exists,
          # anything else (auth, rate limit, 5xx, network) stops the publish.
          check() { # $1 = label, $2 = API path
            local OUT CODE
            OUT=$(gh api -i "$2" 2>&1) || true
            CODE=$(printf '%s\n' "$OUT" | sed -n '1s#^HTTP/[0-9.]* \([0-9][0-9][0-9]\).*#\1#p')
            case "$CODE" in
              404) echo "$1 absent (HTTP 404)";;
              200) echo "$1 already exists (HTTP 200). Bump versionName to publish a new release; refusing."; exit 1;;
              *)   echo "Could not check $1 (status '${CODE:-none}'); refusing to publish."; exit 1;;
            esac
          }
          check "Tag $TAG" "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG"
          check "Release $TAG" "repos/$GITHUB_REPOSITORY/releases/tags/$TAG"
          # Publish ONLY this version's section: release-notes.md keeps full history,
          # but old history in the public notes is a rules violation (v1.7.0 incident).
          # Exact whole-line string match (a version is not a regex: 1.7.0 must not
          # match 1x7y0 or 1.7). The count scans the WHOLE file first so a duplicate
          # heading anywhere fails loudly instead of silently using the first copy;
          # a missing section fails; extraction then stops at the next heading.
          COUNT=$(grep -cFx "## What's new in $VERSION" release-notes.md)
          if [ "$COUNT" -eq 0 ]; then echo "release-notes.md has no section for $VERSION"; exit 1; fi
          if [ "$COUNT" -gt 1 ]; then echo "duplicate section heading for $VERSION in release-notes.md"; exit 1; fi
          awk -v expected="## What's new in $VERSION" '
            $0 == expected { found=1; print; next }
            found && /^## / { exit }
            found { print }
          ' release-notes.md > /tmp/notes.md
          [ -s /tmp/notes.md ] || { echo "release-notes.md section for $VERSION is empty"; exit 1; }
          # A section must carry at least one nonblank BODY line below its heading
          # (the awk output includes the heading, so -s alone permits heading-only).
          tail -n +2 /tmp/notes.md | grep -q '[^[:space:]]' || { echo "release-notes.md section for $VERSION has no body text"; exit 1; }
          # Rule guard: public notes carry no links and no commit hashes. A bare
          # hash must look like one - digits AND a-f letters together - so plain
          # numbers (1000000) and ordinary all-hex-letter words (defaced) pass.
          if grep -qE '\]\(|https?://' /tmp/notes.md; then
            echo "notes for $VERSION contain a link - rules violation, refusing to publish"
            exit 1
          fi
          for w in $(grep -oE '\b[0-9a-f]{7,40}\b' /tmp/notes.md); do
            if echo "$w" | grep -q '[0-9]' && echo "$w" | grep -q '[a-f]'; then
              echo "notes for $VERSION contain a commit hash ($w) - rules violation, refusing to publish"
              exit 1
            fi
          done
          COVER=docs/podcast-cover-3000.png
          echo "$EXPECTED_COVER_SHA256  $COVER" | sha256sum -c - || { echo "cover art hash mismatch - refusing to publish"; exit 1; }
          gh release create "$TAG" "ListenLater-v$VERSION.apk" "$COVER" \
            --target "$(git rev-parse HEAD)" \
            --title "Listen Later $TAG" \
            --notes-file /tmp/notes.md

  # In-place upgrade acceptance on the minified build (Gemini review): published
  # 1.6.4 (vc13) with a queued share upgraded to the new vc14 APK. Real release
  # signatures only, so it can run solely on a main publish run - branch builds
  # carry the throwaway CI key and install -r would refuse the downgrade.
  upgrade-smoke:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record checked-out commit
        run: echo "CHECKED-OUT-SHA $(git rev-parse HEAD) run-sha ${{ github.sha }}"
      - uses: actions/download-artifact@v4
        with:
          name: ListenLater-apk
      - name: Verify downloaded APKs against the build manifest
        run: sha256sum -c ListenLater-SHA256SUMS.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: ./scripts/upgrade-smoke.sh
      # Test-only evidence: emulator PNGs and text from the upgrade check (before/after the upgrade),
      # kept 1 day because run artifacts of a public repo are public. No APK or installer is ever uploaded here.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-smoke-evidence-${{ github.run_id }}
          path: |
            usmoke-evidence/*.png
            usmoke-evidence/*.txt
          retention-days: 1
          if-no-files-found: ignore

  # The migration-gate instrumented test runs on a real emulator: the approved
  # mid-migration carryover proof must actually run and pass, not just compile.
  migration-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record checked-out commit
        run: echo "CHECKED-OUT-SHA $(git rev-parse HEAD) run-sha ${{ github.sha }}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
      - name: Android SDK 37
        run: |
          if ! ls "$ANDROID_HOME/platforms" | grep -q '^android-37'; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" >/dev/null
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          script: ./gradlew --no-daemon connectedDebugAndroidTest && adb install -r app/build/outputs/apk/debug/app-debug.apk && ./scripts/share-smoke.sh

  # Minified release APK on a real emulator: boot, credential-store init, share
  # intake and worker scheduling must survive R8 + resource shrinking. Logcat-based
  # proof (a release build is not debuggable, so run-as checks are impossible here).
  release-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record checked-out commit
        run: echo "CHECKED-OUT-SHA $(git rev-parse HEAD) run-sha ${{ github.sha }}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: ListenLater-apk
      - name: Verify downloaded APKs against the build manifest
        run: sha256sum -c ListenLater-SHA256SUMS.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: ./scripts/release-smoke.sh

  # Real screenshots from an emulator on every main push; used for review before release.
  screenshots:
    needs: build
    runs-on: ubuntu-latest
    # Read-only: this job runs branch-controlled scripts, so the write token for
    # the screenshot commit lives in the separate main-only commit-screenshots
    # job below (ChatGPT review).
    permissions:
      contents: read
    continue-on-error: true
    steps:
      # Pinned to the run's own commit (not the moving branch tip) so the harness scripts match the build.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Record checked-out commit
        run: echo "CHECKED-OUT-SHA $(git rev-parse HEAD) run-sha ${{ github.sha }}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
      - name: Android SDK 37
        run: |
          if ! ls "$ANDROID_HOME/platforms" | grep -q '^android-37'; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" >/dev/null
          fi
      - name: Build debug APK
        # Retry once: a cold cache plus a plugin-portal flake fails plugin
        # resolution transiently (same pattern as the unit-test retry above).
        run: ./gradlew --no-daemon assembleDebug || ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: ./scripts/shots.sh
      - uses: actions/upload-artifact@v4
        with:
          # Artifact names forbid '/'; branch names like tmp/modernization-1124 have one.
          name: screenshots-${{ github.run_id }}
          path: |
            docs/screenshots
            docs/main.png
          if-no-files-found: ignore
  # The write token for committing screenshots exists only here, on main.
  commit-screenshots:
    needs: screenshots
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Record checked-out commit
        run: echo "CHECKED-OUT-SHA $(git rev-parse HEAD) run-sha ${{ github.sha }}"
      - uses: actions/download-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: docs
      - name: Commit screenshots
        run: |
          git config user.name "MtndaleRedneck"
          git config user.email "117659952+MtndaleRedneck@users.noreply.github.com"
          git add docs/screenshots docs/main.png
          git commit -m "Add app screenshots from emulator" || exit 0
          # Binary screenshots can't merge; when two runs race, the newest pixels win.
          git pull --rebase -X theirs origin main
          git push origin HEAD:main

  # Launcher icon shots, only when manually dispatched from a non-main branch.
  icon-shots:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    env:
      # Set to shoot a different APK under the same emulator for launcher-treatment comparisons.
      PROOF_APK_URL: ''
    steps:
      - uses: actions/checkout@v4
      - name: Record checked-out commit
        run: echo "CHECKED-OUT-SHA $(git rev-parse HEAD) run-sha ${{ github.sha }}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
      - name: Android SDK 37
        run: |
          if ! ls "$ANDROID_HOME/platforms" | grep -q '^android-37'; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" >/dev/null
          fi
      - uses: actions/download-artifact@v4
        with:
          name: ListenLater-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: ./scripts/icon-shots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: icon-shots
          path: icon-shots/*.png
