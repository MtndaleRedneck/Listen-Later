name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: listenlater
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No signing secrets set"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          ./gradlew --no-daemon assembleRelease assembleDebug
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Name the APK
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$V" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk ListenLater-v$V.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ListenLater-apk
          path: ListenLater-v*.apk

      # Releases are published only on manual dispatch, after review sign-off.
      # An existing release is never replaced; bump versionName for a new one.
      - name: Publish release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v$VERSION
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump versionName to publish a new release."
            exit 0
          fi
          if [ -f release-notes.md ]; then
            gh release create "$TAG" "ListenLater-v$VERSION.apk" \
              --target "$(git rev-parse HEAD)" \
              --title "Listen Later $TAG" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" "ListenLater-v$VERSION.apk" \
              --target "$(git rev-parse HEAD)" \
              --title "Listen Later $TAG" \
              --notes "Listen Later $TAG. Android 12+. See the README for setup."
          fi
