<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0c0c0e; color:#e8e8ec; font-family:"Segoe UI",system-ui,-apple-system,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:56px 20px 40px; }

  h1 { font-size:30px; font-weight:600; letter-spacing:.2px; }

  .card h2 { font-size:19px; font-weight:600; margin:8px 0 4px; }
  .card .what { font-size:13.5px; color:#9a9aa4; line-height:1.45; min-height:40px; }
  .btn { display:block; background:#e87e1e; color:#141414; font-size:16px; font-weight:700; text-decoration:none; border-radius:10px; padding:13px 0; margin-top:18px; }
  .btn:hover { background:#f28c33; }
  .ver { font-size:12.5px; color:#6d6d78; margin-top:10px; min-height:16px; }
  .fine { color:#6d6d78; font-size:13px; margin-top:44px; text-align:center; line-height:1.7; max-width:520px; }
  .fine a { color:#e87e1e; text-decoration:none; }
  .fine a:hover { text-decoration:underline; }
